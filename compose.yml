name: luna-v2

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: luna-v2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: luna
      POSTGRES_USER: luna
      POSTGRES_PASSWORD: luna
    ports:
      - "127.0.0.1:${LUNA_V2_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luna -d luna"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: luna-v2-ollama
    gpus: all
    environment:
      # The local provider must allocate this window in the Ollama runner.
      # 8k safely covers the Orchestrator's current prompt on the 8 GB GPU.
      OLLAMA_CONTEXT_LENGTH: "8192"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LUNA_V2_OLLAMA_PORT:-11435}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20

  ollama-init:
    image: ollama/ollama:latest
    container_name: luna-v2-ollama-init
    environment:
      OLLAMA_HOST: ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3:4b-instruct}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-qwen3-embedding:0.6b}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        ensure_model() {
          if ollama list | awk 'NR > 1 { print $$1 }' | grep -Fxq "$$1"; then
            echo "Model $$1 is already available."
            return
          fi

          ollama pull "$$1"
        }

        ensure_model "$$OLLAMA_CHAT_MODEL"
        ensure_model "$$OLLAMA_EMBEDDING_MODEL"
        ensure_model "qwen3.5:4b"
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_data:/root/.ollama
    restart: "no"

  reranker:
    image: luna-v2-reranker:local
    container_name: luna-v2-reranker
    build:
      context: .
      dockerfile: apps/reranker/Dockerfile
    environment:
      RERANKER_MODEL_DIR: /models
      QWEN_RERANKER_PORT: "8201"
    volumes:
      - reranker_data:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8200/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  searxng:
    image: searxng/searxng:2026.9.22-2ed96e6fc
    container_name: luna-v2-searxng
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_BIND_ADDRESS: 0.0.0.0
      SEARXNG_SECRET: ${SEARXNG_SECRET:-luna-v2-local-research-secret}
      FORCE_OWNERSHIP: "false"
    volumes:
      - ./infra/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng_cache:/var/cache/searxng
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Uses the existing Speaches image and the legacy Luna model-cache name.
  speaches:
    image: ghcr.io/speaches-ai/speaches@sha256:6ec12ebf890a17e0d4b242a8ba9e0eb1fb836e60e8a3c857aea9838d541579ac
    container_name: luna-v2-speaches
    gpus: all
    restart: unless-stopped
    environment:
      WHISPER__INFERENCE_DEVICE: cuda
      WHISPER__COMPUTE_TYPE: float16
      STT_MODEL_TTL: "60"
      HF_HUB_CACHE: /home/ubuntu/.cache/huggingface
    volumes:
      - speaches_models:/home/ubuntu/.cache/huggingface
    ports:
      - "127.0.0.1:${LUNA_V2_SPEACHES_PORT:-8003}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30

  speaches-model-init:
    image: curlimages/curl:8.12.1
    command:
      - "--fail"
      - "--retry"
      - "30"
      - "--retry-connrefused"
      - "--retry-delay"
      - "2"
      - "-X"
      - "POST"
      - "http://speaches:8000/v1/models/${SPEACHES_STT_MODEL:-Systran/faster-whisper-small}"
    depends_on:
      speaches:
        condition: service_healthy
    restart: "no"

  kokoro:
    image: luna-v2-kokoro:local
    build:
      context: .
      dockerfile: infra/kokoro/Dockerfile
    container_name: luna-v2-kokoro
    restart: unless-stopped
    environment:
      KOKORO_DEVICE: cpu
      KOKORO_PRELOAD_LANGS: p
      MAX_CONCURRENCY: "1"
      VOICES_DIR: /voices
    volumes:
      - kokoro_cache:/root/.cache
      - voice_packs:/voices:ro
    ports:
      - "127.0.0.1:${LUNA_V2_KOKORO_PORT:-8002}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30

  qwen-tts:
    image: luna-v2-qwen-tts:local
    build:
      context: .
      dockerfile: services/qwen-tts/Dockerfile
    container_name: luna-v2-qwen-tts
    gpus: all
    restart: unless-stopped
    environment:
      QWEN_TTS_MODEL: Qwen/Qwen3-TTS-12Hz-0.6B-Base
      QWEN_REFERENCE_AUDIO: /reference/Luna-Voice.wav
      QWEN_REFERENCE_TEXT: /reference/Luna-Voice.txt
      QWEN_IDLE_UNLOAD_SECONDS: "60"
      HF_HOME: /root/.cache/huggingface
    volumes:
      - ./tools/qwen-voice-cloning/data:/reference:ro
      - type: bind
        source: ${USERPROFILE}/.cache/huggingface
        target: /root/.cache/huggingface
    ports:
      - "127.0.0.1:8101:8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  qwen-tts-fast:
    image: luna-v2-qwen-tts-fast:local
    build:
      context: .
      dockerfile: services/qwen-tts-fast/Dockerfile
    container_name: luna-v2-qwen-tts-fast
    gpus: all
    restart: unless-stopped
    environment:
      QWEN_TTS_MODEL: Qwen/Qwen3-TTS-12Hz-0.6B-Base
      QWEN_REFERENCE_AUDIO: /reference/Luna-Voice.wav
      QWEN_REFERENCE_TEXT: /reference/Luna-Voice.txt
      QWEN_IDLE_UNLOAD_SECONDS: "60"
      HF_HOME: /root/.cache/huggingface
    volumes:
      - ./tools/qwen-voice-cloning/data:/reference:ro
      - type: bind
        source: ${USERPROFILE}/.cache/huggingface
        target: /root/.cache/huggingface
    ports:
      - "127.0.0.1:8103:8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  f5-tts:
    image: luna-v2-f5-tts:local
    build:
      context: .
      dockerfile: services/f5-tts/Dockerfile
    container_name: luna-v2-f5-tts
    gpus: all
    restart: unless-stopped
    environment:
      F5_MODEL_ID: firstpixel/F5-TTS-pt-br
      F5_MODEL_FILE: pt-br/model_last.safetensors
      F5_REFERENCE_AUDIO: /reference/Luna-Voice-F5.wav
      F5_REFERENCE_TEXT: /reference/Luna-Voice-F5.txt
      F5_NFE_STEP: "16"
      F5_IDLE_UNLOAD_SECONDS: "60"
      HF_HOME: /root/.cache/huggingface
    volumes:
      - ./tools/qwen-voice-cloning/data:/reference:ro
      - type: bind
        source: ${USERPROFILE}/.cache/huggingface
        target: /root/.cache/huggingface
    ports:
      - "127.0.0.1:8102:8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  wakeword:
    image: luna-v2-wakeword:local
    build:
      context: .
      dockerfile: services/wakeword/Dockerfile
    container_name: luna-v2-wakeword
    restart: unless-stopped
    environment:
      WAKE_MODEL_PATH: /app/models/luna.onnx
    volumes:
      - ./services/wakeword/models:/app/models:ro

  wakeword-training:
    profiles: [wakeword-training]
    image: luna-v2-wakeword-training:local
    build:
      context: .
      dockerfile: tools/wakeword-training/Dockerfile
    environment:
      KOKORO_BASE_URL: http://kokoro:8000
      QWEN_TTS_BASE_URL: http://qwen-tts:8100
      WAKEWORD_BASE_URL: http://wakeword:8765
    volumes:
      - ./tools/wakeword-training/data:/workspace/tools/wakeword-training/data
      - ./tools/wakeword-training/models:/workspace/tools/wakeword-training/models
      - ./tools/wakeword-training/reports:/workspace/tools/wakeword-training/reports
      - ./services/wakeword/models:/workspace/services/wakeword/models
    depends_on:
      kokoro:
        condition: service_healthy
      qwen-tts:
        condition: service_healthy

  voice-packs-init:
    image: node:22-bookworm-slim
    user: root
    command: ["chown", "-R", "1000:1000", "/voices"]
    volumes:
      - voice_packs:/voices
    restart: "no"

  migrate:
    image: luna-v2-migrate:local
    container_name: luna-v2-migrate
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://luna:luna@postgres:5432/luna?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: luna-v2-api:local
    container_name: luna-v2-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: "8000"
      DATABASE_URL: postgresql://luna:luna@postgres:5432/luna?schema=public
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
      LLM_COMBO: ${LLM_COMBO:-paid-general}
      ORCHESTRATOR_COMBO: ${ORCHESTRATOR_COMBO:-local-general}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      RETRIEVAL_RERANKER_URL: http://reranker:8200
      OMNIROUTE_BASE_URL: ${OMNIROUTE_BASE_URL:-http://host.docker.internal:20128/v1}
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://searxng:8080}
      SEARXNG_TIMEOUT_MS: ${SEARXNG_TIMEOUT_MS:-8000}
      WEB_EXTRACT_TIMEOUT_MS: ${WEB_EXTRACT_TIMEOUT_MS:-12000}
      WEB_EXTRACT_MAX_BYTES: ${WEB_EXTRACT_MAX_BYTES:-2000000}
      SPEACHES_BASE_URL: http://speaches:8000
      SPEACHES_STT_MODEL: ${SPEACHES_STT_MODEL:-Systran/faster-whisper-small}
      SPEACHES_STT_LANGUAGE: ${SPEACHES_STT_LANGUAGE:-pt}
      KOKORO_BASE_URL: http://kokoro:8000
      QWEN_TTS_FAST_BASE_URL: http://qwen-tts-fast:8100
      F5_TTS_BASE_URL: http://f5-tts:8100
      FISH_AUDIO_API_KEY: ${FISH_AUDIO_API_KEY:-}
      WAKEWORD_BASE_URL: http://wakeword:8765
      VOICE_PACKS_DIR: /voices
      WAKE_TRAINING_DATA_DIR: /wake-training-data
    depends_on:
      migrate:
        condition: service_completed_successfully
      ollama-init:
        condition: service_completed_successfully
      reranker:
        condition: service_started
      searxng:
        condition: service_healthy
      speaches-model-init:
        condition: service_completed_successfully
      kokoro:
        condition: service_healthy
      f5-tts:
        condition: service_healthy
      qwen-tts-fast:
        condition: service_healthy
      wakeword:
        condition: service_started
      voice-packs-init:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${LUNA_V2_API_PORT:-8000}:8000"
    volumes:
      - voice_packs:/voices
      - ./tools/wakeword-training/data:/wake-training-data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8000/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    image: luna-v2-web:local
    container_name: luna-v2-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://api:8000
        NEXT_PUBLIC_VOICE_WS_URL: ${NEXT_PUBLIC_VOICE_WS_URL:-}
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${LUNA_V2_WEB_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  # Reuses the volume created by the previous apps/docker-compose.yml setup,
  # preserving the existing Luna V2 conversations during the move to the root.
  postgres_data:
    external: true
    name: ${LUNA_V2_POSTGRES_VOLUME:-apps_luna_postgres_data}
  ollama_data:
    # Shares the model store from the previous Luna Compose project so Ollama
    # can reuse already-downloaded blobs and manifests instead of pulling them again.
    external: true
    name: ${LUNA_V2_OLLAMA_VOLUME:-luna_luna-ollama-data}
  reranker_data:
    name: luna-v2-reranker-models
  searxng_cache:
    name: luna-v2-searxng-cache
  speaches_models:
    name: ${LUNA_V2_SPEACHES_VOLUME:-luna_luna-speaches-models}
  kokoro_cache:
    name: ${LUNA_V2_KOKORO_VOLUME:-luna_luna-kokoro-cache}
  voice_packs:
    name: luna-v2-voice-packs
