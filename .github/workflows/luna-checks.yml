name: Luna CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  luna-checks:
    name: Luna checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Test Discord voice worker
        working-directory: services/discord-voice
        run: npm ci --ignore-scripts && npm test
      - name: Test the candidate against the PR base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/eval/compare.mjs --base "$BASE_SHA" --candidate "$CANDIDATE_SHA" --fixture --unit
